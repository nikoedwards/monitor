name: Deploy Monitor to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test deployment recovery logic
        run: python3 -m unittest discover -s tests -p test_aliyun_deploy.py -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: monitor-deploy:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/nikoedwards/monitor
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check backend and voice/source regressions in release image
        run: |
          docker run --rm --network none \
            -e MONITOR_SCHEDULER=0 \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            -v "$GITHUB_WORKSPACE/deploy:/app/deploy:ro" \
            "monitor-deploy:$GITHUB_SHA" \
            sh -ec 'python -m compileall -q server &&
              python -m unittest discover -s /app/tests -p test_voc_sources.py -v &&
              python -m unittest discover -s /app/tests -p test_source_status.py -v'
      - name: Transfer image and deploy
        env:
          SSH_HOST: ${{ secrets.ALIYUN_MONITOR_HOST }}
          SSH_KEY: ${{ secrets.ALIYUN_MONITOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_MONITOR_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          deploy_tmp=$(mktemp -d)
          trap 'rm -rf "$deploy_tmp"' EXIT
          printf '%s\n' "$SSH_KEY" > "$deploy_tmp/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$deploy_tmp/known_hosts"
          docker save "monitor-deploy:$GITHUB_SHA" | gzip -1 | \
            ssh -T -i "$deploy_tmp/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$deploy_tmp/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=20 \
              -o ServerAliveCountMax=15 \
              "monitor-deploy@$SSH_HOST" "deploy $GITHUB_SHA"
      - name: Check public endpoint
        env:
          SSH_HOST: ${{ secrets.ALIYUN_MONITOR_HOST }}
        run: curl --fail --retry 3 --retry-delay 5 --max-time 30 "http://$SSH_HOST/api/health"
